services:
  # ============================================================================
  # Backend Web Service (Django 5+ DRF with Gunicorn & WhiteNoise)
  # ============================================================================
  - type: web
    name: laundrygo-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DATABASE_URL
        fromDatabase:
          name: laundrygo-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: FRONTEND_URL
        value: ""
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "LaundryGo <info@thelaundrygo.com>"
      - key: ADMIN_EMAIL
        value: "info@thelaundrygo.com"

  # ============================================================================
  # Frontend Static Site (React 19 + Vite + Tailwind CSS v4)
  # ============================================================================
  - type: static
    name: laundrygo-web
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      # Single Page Application (SPA) routing rewrite rule
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: laundrygo-api
          envVarKey: RENDER_EXTERNAL_URL

# ==============================================================================
# Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: laundrygo-db
    databaseName: laundrygo_db
    user: laundrygo
    plan: free
